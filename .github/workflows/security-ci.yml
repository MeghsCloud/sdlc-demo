name: Security CI Pipeline (Checkov + Trivy + OPA + Release Agent)

on:
  push:
    paths:
      - "k8s/**"
      - "policies/**"
      - "Dockerfile"
      - "**/*.tf"
      - "app/**"
  pull_request:
    paths:
      - "k8s/**"
      - "policies/**"
      - "Dockerfile"
      - "**/*.tf"
      - "app/**"

jobs:
  security-pipeline:
    runs-on: [self-hosted, eks]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ---------------------------
      # 1. Checkout Code
      # ---------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------
      # 2. CHECKOV (IaC Security)
      # ---------------------------
      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          output_format: json
          output_file_path: checkov-results

      - name: Move Checkov results
        run: |
          if [ -f checkov-results/results_json.json ]; then
            mv checkov-results/results_json.json checkov.json
            rm -rf checkov-results
          fi

      # ---------------------------
      # 3. TRIVY (Filesystem Scan)
      # ---------------------------
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy.json"

      # ---------------------------
      # 4. OPA (Policy Enforcement)
      # ---------------------------
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Run OPA Policy Check
        run: |
          opa eval --format json \
            --data policies \
            --input k8s/deployment.yaml \
            "data.kubernetes.deny" > opa.json

      # ---------------------------
      # 5. Upload Scan Artifacts
      # (important for AI agents)
      # ---------------------------
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy.json
            checkov.json
            opa.json

      # ---------------------------
      # 6. RELEASE AGENT (AI Decision Layer)
      # ---------------------------
      - name: Run Release Agent (AI Decision Engine)
        run: |
          python agents/release-agent.py trivy.json checkov.json opa.json