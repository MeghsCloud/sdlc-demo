name: "Phase 4: Deploy to EKS"

on:
  workflow_run:
    workflows: ["Phase 3: Build & Push to ECR"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to latest)"
        required: false
        default: "latest"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sdlc-demo
  EKS_CLUSTER: EksCluster
  NAMESPACE: default

jobs:
  deploy:
    runs-on: [self-hosted, eks]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ---------------------------
      # 1. Checkout
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Configure AWS Credentials
      # ---------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------
      # 3. Setup kubectl
      # ---------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      # ---------------------------
      # 4. Setup Python (for agents)
      # ---------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------
      # 5. Pre-Deploy Agent Check
      # ---------------------------
      - name: Run Deploy Agent (Pre-deploy)
        run: |
          python agents/deploy-agent.py sdlc-demo ${{ env.NAMESPACE }} --pre

      # ---------------------------
      # 6. Determine Image Tag
      # ---------------------------
      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying with tag: $TAG"

      # ---------------------------
      # 7. Login to ECR
      # ---------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------
      # 8. Deploy to EKS
      # ---------------------------
      - name: Deploy to EKS
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"

          echo "Deploying image: $IMAGE"

          # Update the image in the deployment manifest
          sed -i "s|<ECR_IMAGE>:latest|$IMAGE|g" k8s/deployment.yml

          # Apply the deployment
          kubectl apply -f k8s/deployment.yml -n ${{ env.NAMESPACE }}

          # Wait for rollout
          kubectl rollout status deployment/sdlc-demo -n ${{ env.NAMESPACE }} --timeout=180s

      # ---------------------------
      # 9. Post-Deploy Agent Check
      # ---------------------------
      - name: Run Deploy Agent (Post-deploy)
        run: |
          python agents/deploy-agent.py sdlc-demo ${{ env.NAMESPACE }} --post

      # ---------------------------
      # 10. Rollback on Failure
      # ---------------------------
      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Deployment failed - initiating rollback"
          kubectl rollout undo deployment/sdlc-demo -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/sdlc-demo -n ${{ env.NAMESPACE }} --timeout=120s
