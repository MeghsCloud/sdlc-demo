apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-agent
  namespace: default
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: runtime-agent-sa
          restartPolicy: Never
          containers:
            - name: runtime-agent
              image: python:3.12-slim
              command:
                - /bin/sh
                - -c
                - |
                  pip install -q kubernetes
                  python /scripts/runtime-agent.py sdlc-demo default --alert
              volumeMounts:
                - name: agent-scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: agent-scripts
              configMap:
                name: runtime-agent-scripts
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-agent-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-agent-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: runtime-agent-sa
    namespace: default
roleRef:
  kind: Role
  name: runtime-agent-role
  apiGroup: rbac.authorization.k8s.io
