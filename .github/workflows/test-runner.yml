name: Test EKS Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, eks]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "Runner is working inside EKS"
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
