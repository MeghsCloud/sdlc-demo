apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-agent
spec:
  schedule: "*/10 * * * *"

  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: runtime-agent

        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000

          restartPolicy: OnFailure

          containers:
            - name: runtime-agent
              image: busybox:latest

              command:
                - /bin/sh
                - -c
                - echo "Running runtime agent"

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"