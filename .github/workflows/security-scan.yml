name: "Phase 2: Security CI Pipeline"

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "k8s/**"
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: [self-hosted, eks]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ---------------------------
      # 1. Checkout
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Trivy - Container Image Scan
      # ---------------------------
      - name: Build image for scanning
        run: |
          docker build -t sdlc-demo:scan .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sdlc-demo:scan"
          format: "json"
          output: "trivy-container.json"
          severity: "CRITICAL,HIGH,MEDIUM"

      # ---------------------------
      # 3. Trivy - Filesystem Scan
      # ---------------------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-fs.json"
          severity: "CRITICAL,HIGH,MEDIUM"

      # ---------------------------
      # 4. Dependency Scanning
      # ---------------------------
      - name: Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "json"
          output: "trivy-deps.json"

      # ---------------------------
      # 5. SBOM Generation
      # ---------------------------
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sdlc-demo:scan"
          format: "cyclonedx"
          output: "sbom.json"

      # ---------------------------
      # 6. Upload Security Artifacts
      # ---------------------------
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            trivy-container.json
            trivy-fs.json
            trivy-deps.json
            sbom.json

      # ---------------------------
      # 7. Security Agent Decision
      # ---------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Security Agent
        run: |
          python agents/security-agent.py

      # ---------------------------
      # 8. Peer Review Agent
      # ---------------------------
      - name: Run Peer Review Agent
        run: |
          python agents/peer-review-agent.py

      # ---------------------------
      # 9. Fail on Critical Findings
      # ---------------------------
      - name: Check for Critical Vulnerabilities
        run: |
          CRITICAL=$(cat trivy-container.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          results = data.get('Results', [])
          count = sum(1 for r in results for v in (r.get('Vulnerabilities') or []) if v.get('Severity') == 'CRITICAL')
          print(count)
          ")
          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical vulnerabilities found - blocking pipeline"
            exit 1
          fi
